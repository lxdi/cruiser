plugins {
	id 'org.springframework.boot' version "${springBootVersion}"
	id 'io.spring.dependency-management' version "${springDependencyVerion}"
	id 'java'
	id 'war'
}

group = 'com.sogoodlab'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	implementation  'org.json:json:20190722'
	implementation 'commons-io:commons-io:2.6'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
	useJUnitPlatform()
}

tasks.register('copyFront', Copy) {
    from '../frontend/build'
    into 'src/main/resources/static'
}

tasks.register('fullClean', Delete) {
    delete 'src/main/resources/static'
}

processResources.dependsOn copyFront
clean.dependsOn fullClean

bootJar {
	archiveFileName = 'ROOT.jar'
}

copyFront {
    dependsOn ':frontend:compile'
}

